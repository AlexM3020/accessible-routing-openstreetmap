[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osm-accessibility-research"
version = "0.2.0"
description = "Reproducible accessibility-aware pathfinding and diagnostics on OpenStreetMap graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.10,<5",
  "matplotlib>=3.9,<4",
  "pyproj>=3.6,<4",
  "defusedxml>=0.7,<1",
  "ijson>=3.3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mongomock>=4.3,<5"]

[project.scripts]
osm-accessibility = "osm_accessibility.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["osm_accessibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["osm_accessibility"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]